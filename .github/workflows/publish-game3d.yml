name: Publish game3d package

# Publishes the game3d npm package publicly to npmjs.org on a game3d-v* tag
# (or manually via dispatch). The tarball is packed once, verified (exact
# file allow-list + secret scans over the extracted bytes + a studio-API
# host-coupling tripwire), and that same verified artifact is what gets
# published. Requires the NPM_TOKEN repo secret (an npmjs automation token
# with publish rights on @kbot).

on:
  push:
    tags: ['game3d-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages-js/game3d
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Tag / package version guard
        if: startsWith(github.ref, 'refs/tags/game3d-v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#game3d-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Install workspace (esbuild)
        run: npm ci
        working-directory: .

      - name: Build dist payload
        run: npm run build

      - name: Pack and verify tarball contents
        run: node scripts/verify-tarball.mjs pack-verify

      - name: Install secret scanners
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sudo sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Secret scan (trufflehog)
        run: trufflehog --no-update filesystem pack-verify/extracted --results=verified,unknown --fail

      - name: Secret scan (trivy)
        run: trivy fs --scanners secret --exit-code 1 pack-verify/extracted

      - name: Vulnerability scan (informational)
        run: trivy fs --scanners vuln --exit-code 0 pack-verify/extracted

      - name: Publish verified tarball
        run: npm publish ./pack-verify/*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  consume-proof:
    # From a scratch directory outside the repo, install the just-published
    # package from npmjs.org and drive it in headless Chromium: the
    # published artifact must paint a non-blank frame and addUnit() must
    # increase the rendered draw count, with nothing from this checkout but
    # the test files. No auth: the package is public and npmjs is npm's
    # default registry.
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install from npmjs.org and run headless
        run: |
          NAME="$(node -p "require('./packages-js/game3d/package.json').name")"
          VERSION="$(node -p "require('./packages-js/game3d/package.json').version")"
          SCRATCH="$RUNNER_TEMP/consume-game3d"
          mkdir -p "$SCRATCH"
          cp examples/consume-game3d/test.mjs examples/consume-game3d/browser-entry.mjs "$SCRATCH/"
          cd "$SCRATCH"
          npm init -y > /dev/null
          # A fresh publish can take a moment to become installable; retry briefly.
          for attempt in 1 2 3 4 5; do
            npm install "$NAME@$VERSION" && break
            [ "$attempt" = 5 ] && exit 1
            sleep 30
          done
          npm install esbuild playwright
          npx playwright install --with-deps chromium
          grep -q "registry.npmjs.org" package-lock.json
          ! grep -q "npm.pkg.github.com" package-lock.json
          node test.mjs
