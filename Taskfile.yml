version: '3'

dotenv: ['.env.local', '.env']

tasks:
  default:
    desc: Build, vet, lint, and test
    cmds:
      - task: build
      - task: vet
      - task: lint
      - task: test

  build:
    desc: Build all binaries
    cmds:
      - task: build-studio-web
      - task: build-wasm
      - task: bundle-studio-web
      - task: build-kbot

  build-wasm:
    desc: Build the deterministic engine wasm locally from the kbot-engine module and stage it (with its matching wasm_exec.js) for the studio web client
    cmds:
      - GOOS=js GOARCH=wasm go build -o internal/studio/web/engine/engine.wasm github.com/coreprime/kbot-engine/cmd/engine-wasm
      - cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" internal/studio/web/engine/wasm_exec.js

  build-kbot:
    desc: Build the kbot CLI
    cmds:
      - CGO_ENABLED=0 go build -o bin/kbot ./cmd/kbot

  build-studio-web:
    desc: Install the JS workspace (studio web + registry-published @coreprime/kbot-* packages) and lint it
    cmds:
      - npm install
      - task: lint-js

  bundle-studio-web:
    desc: Bundle the KBot Studio web app with Vite into web/dist (embedded by build-kbot)
    cmds:
      - npx vite build
    dir: internal/studio/web

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint and eslint
    cmds:
      - golangci-lint run ./...
      - task: lint-js

  lint-js:
    desc: Run ESLint over the studio web app
    cmds:
      - npx eslint . --max-warnings 0

  test:
    desc: Run all tests
    cmds:
      - go test ./...
      - task: test-js

  test-js:
    desc: Run the monorepo-owned JS unit tests (pure UI helpers) and the wasm spawn smoke gate
    cmds:
      # Build the studio wasm first so the spawn smoke test loads the sim built
      # from the CURRENT engine/sim, not a stale artifact — this is the gate
      # that turns a future engine change breaking the studio wasm into a CI
      # failure instead of an in-browser spawn crash.
      - task: build-wasm
      - node --test "internal/studio/web/ui/map-editor/tak-rotate.test.js"
      - node --test "internal/studio/web/ui/sandbox/map-features-sim.test.js"
      - node --test "internal/studio/web/engine/spawn-smoke.test.js"
      - node --test "internal/studio/web/engine/build-legality.test.js"

  test-verbose:
    desc: Run all tests
    cmds:
      - go test ./formats/tnt/... -v
    
  test-race:
    desc: Run all tests with race detector
    cmds:
      - go test -race ./...

  coverage:
    desc: Generate code coverage report
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html
      - echo "Coverage report written to coverage.html"

  test-cover:
    desc: Run tests with coverage and open in browser
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin/ coverage.out coverage.html .cache/ kbot

  install:
    desc: Run the KBot Explorer against the TA assets
    cmds:
      - task: build
      - go install ./cmd/kbot
    
  run-explorer-ta:
    desc: Run KBot Studio against the TA packed assets
    cmds:
      - task: install
      - kbot studio {{.TA_PACKED_PATH}}
  
  run-mcp-ta:
    desc: Run the KBot Explorer against the TA packed assets
    cmds:
      - task: install
      - kbot mcp --mount {{.TA_PACKED_PATH}}
   
  run-explorer-tak:
    desc: "Run KBot Studio against the TA: Kingdoms packed assets"
    cmds:
      - task: install
      - kbot studio {{.TAK_PACKED_PATH}}
  
  run-mcp-tak:
    desc: Run the KBot Explorer against the TA packed assets
    cmds:
      - task: install
      - kbot mcp --mount {{.TAK_PACKED_PATH}}

  roundtrip:
    desc: Runs round-trip validation of game content, validaitng we can correctly handle formats
    cmds:
      - task: install
      - kbot cob roundtrip {{.TA_UNPACKED_PATH}}
      - kbot gaf roundtrip {{.TA_UNPACKED_PATH}}

  document:
    desc: Regenerate the TA reference catalogue at ../reference-ta (sibling to kbot)
    vars:
      REFERENCE_PATH: '{{.REFERENCE_PATH | default "../reference-ta"}}'
    cmds:
      - task: install
      - kbot document --source {{.TA_UNPACKED_PATH}} --target {{.REFERENCE_PATH}}

  document-tak:
    desc: Regenerate the TA:K reference catalogue at ../reference-tak (sibling to kbot)
    vars:
      REFERENCE_PATH: '{{.REFERENCE_TAK_PATH | default "../reference-tak"}}'
    cmds:
      - task: install
      - kbot document --game takingdoms --source {{.TAK_UNPACKED_PATH}} --target {{.REFERENCE_PATH}}