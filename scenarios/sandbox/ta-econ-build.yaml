# TA construction: nanolathe pacing, prorated resource drain, HP ladder.
# Ground truth: economy spec §1.1 (1 Hz settle), §3.1 (applicator), §9.1
# (worked example: ARMCOM WorkerTime=300 builds ARMMEX BuildTime=1800,
# BuildCostEnergy=521, BuildCostMetal=50, MaxDamage=170).
name: ta-econ-build
game: ta
system: economy
spec: economy.md §1.1, §2.2, §3.1, §9.1
description: >-
  The Commander raises a Metal Extractor 40 wu away (inside Builddistance
  60, so no approach walk). Per tick the applicator advances progress by
  floor(300/30)/1800 and posts prorated buildcost demand; the pools settle
  once per second against the commander's own income (EnergyMake 25,
  MetalMake 1). Skirmish-default 1000/1000 starting stock assumed.
seed: 1
duration: 420
units:
  - alias: com
    type: armcom
    side: 0
    pos: [200, 200]
    heading: 0
actions:
  - at: 0
    do: build
    unit: com
    build: armmex
    to: [240, 200]
    spawns: mex
checks:
  - at: 90
    unit: mex
    observable: unit.build_percent
    expect: 50
    label: nanolathe pace at mid-build
    derivation: |
      amount = floor(WorkerTime 300 / 30) = 10 build points per tick
      (unsigned integer division — fractional worker power discarded).
      Progress per tick = 10/1800; ticks to build = 1800/10 = 180.
      At frame 90 (assuming work begins on frame 1; the order layer's
      startup latency is not pinned by the spec but is at most a few
      frames): progress = 90 * 10/1800 = 50%.
  - at: 200
    unit: mex
    observable: unit.build_percent
    expect: 100
    label: complete after 180 work ticks
    derivation: |
      180 ticks of work = 6.0 s; even with a generous ~20-frame startup
      the extractor is complete well before frame 200.
  - at: 400
    unit: mex
    observable: unit.hp
    expect: 170
    label: HP ladder ends exactly at maxdamage
    derivation: |
      A nanoframe spawns at remaining=1.0, HP=0 and climbs the truncation
      ladder hpDelta = ftol(maxdamage*rem) - ftol(maxdamage*newRem); the
      ladder telescopes to exactly MaxDamage=170 at completion.
  - at: 65
    side: 0
    observable: side.energy
    baseline: 65536000
    expect: -8104624
    label: energy pool movement over two settles
    derivation: |
      Per-tick demand posts costE = f32(10/1800) * 521 = 2.8944445; one
      settle window sums 30 f32 adds = 86.833344 (f32). Settles land at
      frames 30 and 60: each pays the granted demand and credits the
      commander's EnergyMake=25. Pool after two settles =
      1000 + 2*25 - 2*86.833344 = 876.33325 (f32).
      Effect vs the 1000 start = -123.66675 -> raw 16.16 =
      57431376 - 65536000 = -8104624. (Exact f32-vs-fixed representation
      cannot agree bit-for-bit — economy substrate is float32 x87 —
      but the magnitude grades the drain model.) Baseline 65536000 =
      the shared 1000 starting stock, so the check measures movement;
      zero movement means the build never drained the pool at all.
    missing_if_zero: true
  - at: 65
    side: 0
    observable: side.metal
    baseline: 65536000
    expect: -961192
    label: metal pool movement over two settles
    derivation: |
      costM = f32(10/1800) * 50 = 0.2777778/tick; 30 adds = 8.333331/settle.
      Pool after two settles = 1000 + 2*1 - 2*8.333331 = 985.33337 (f32)
      -> raw 64574808; effect = 64574808 - 65536000 = -961192.
    missing_if_zero: true
