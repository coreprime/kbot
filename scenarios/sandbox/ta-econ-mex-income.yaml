# TA metal extractor income: yield = extractsmetal * sum over footprint
# cells of (cell metal byte + 1), cached at placement, credited per settle.
# Ground truth: economy spec §1.5 branch 1 (no extraction radius; footprint
# cells only; energyOK gate).
name: ta-econ-mex-income
game: ta
system: economy
spec: economy.md §1.1, §1.5
description: >-
  A lone completed ARMMEX (ExtractsMetal=0.001, EnergyUse=3, footprint
  3x3, ActivateWhenBuilt) stands on a metal patch of value 40 in every
  footprint cell. Expected income = 0.001 * 9 * (40+1) = 0.369 metal per
  settle while the energy axis is unstalled (1000 energy start covers the
  3 E/s demand). The sandbox map model carries no per-cell metal at all,
  so any income here must come from a metal-map input that does not exist.
seed: 1
duration: 310
units:
  - alias: mex
    type: armmex
    side: 0
    pos: [200, 200]
    heading: 0
checks:
  - at: 305
    side: 0
    observable: side.metal
    baseline: 65536000
    expect: 241827
    label: extractor yield over ten settles
    derivation: |
      Placement-time cached yield = f32(0.001 * (9 cells * (40+1)))
      = 0.36899999 metal per settle. Ten settles (frames 30..300) credit
      f32 accumulation 3.6899998 -> raw trunc(3.6899998 * 65536) = 241827.
      The scenario declares the metal patch (metal byte 40, the common TNT
      patch value) as map input — a real TNT cell attribute, not a unit
      stat. Baseline 65536000 removes the shared 1000 start; zero movement
      means map-metal income is entirely absent from the sandbox.
    missing_if_zero: true
